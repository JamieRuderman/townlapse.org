name: Review a suggestion
# Runs when a suggestion issue is opened (the issue form, or a Worker filing label "suggestion"),
# when Muse reports Facebook findings (label "muse-reported"), or when a maintainer adds "approved".
# scripts/review.py finds the suggestion's town folder; an accepted one rebuilds that folder and is pushed to main,
# which republishes the site.
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: map-data
  cancel-in-progress: false
jobs:
  review:
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'suggestion')) ||
      (github.event.action == 'labeled' && (github.event.label.name == 'muse-reported' || github.event.label.name == 'approved'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER }}
          MODE: ${{ github.event.label.name == 'approved' && 'approve' || 'review' }}
        run: python scripts/review.py
      # Issue titles are public input: they reach the shell only through env, never through ${{ }} in the script.
      - if: steps.review.outputs.changed == 'true'
        env:
          TOWN: ${{ steps.review.outputs.town }}
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          python "$TOWN/build.py"
          git config user.name "map-bot"; git config user.email "map-bot@users.noreply.github.com"
          git add "$TOWN/suggestions_applied.json" "$TOWN/geocache.json" "$TOWN/places.json" "$TOWN/index.html"
          git commit -m "Suggestion #$NUM ($TOWN): $TITLE" && git pull --rebase && git push
